<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 遊戲架構大師 v12.0 - 教育神作與完整系統版</title>
    <style>
        :root {
            --primary: #00ff88;
            --accent: #ffcc00;
            --bg: #050a08;
            --card: #0a1410;
            --text: #e0f0e8;
            --border: #1a3324;
            --warning: #ff3366;
            --edu: #44ccff;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.6;
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #0a1a14 0%, #050a08 100%);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--border);
            box-shadow: 0 10px 50px rgba(0, 255, 136, 0.15);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            margin-top: 0;
            letter-spacing: 2px;
        }

        .input-group { margin-bottom: 25px; }
        label.group-title { 
            display: flex; 
            align-items: center; 
            margin-bottom: 12px; 
            font-weight: bold; 
            color: var(--primary); 
            font-size: 1.1rem; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; 
        }
        
        textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }

        .edu-textarea { border-color: var(--edu); color: var(--edu); }
        .edu-textarea:focus { border-color: var(--edu); box-shadow: 0 0 15px rgba(68, 204, 255, 0.3); }

        select, input[type="text"] {
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            margin-top: 5px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        
        optgroup { color: var(--primary); font-weight: bold; background: #111; }
        option { color: #fff; background: #000; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .feature-box {
            background: #080f0c;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .feature-box.locked { border-color: var(--warning); background: linear-gradient(180deg, #1a050a, #000); }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #ccc;
        }

        input[type="checkbox"] { 
            margin-right: 12px; 
            accent-color: var(--warning); 
            width: 18px; 
            height: 18px; 
            cursor: pointer;
        }

        .select-row { margin-bottom: 15px; font-size: 0.95rem; }
        .select-row span { display: block; margin-bottom: 5px; color: #888; font-size: 0.85rem; font-weight: bold; }

        button.generate-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), #0099ff);
            border: none;
            color: #000;
            font-weight: 900;
            font-size: 1.4rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        button.generate-btn:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 255, 136, 0.4); }

        .output-box {
            margin-top: 30px;
            background: #000;
            padding: 25px;
            border: 1px solid var(--primary);
            border-radius: 8px;
            position: relative;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--primary);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            margin: 0;
            max-height: 500px;
            overflow-y: auto;
            line-height: 1.6;
        }

        .copy-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .copy-btn:hover { background: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>Game Architect 12.0 - 教育神作與系統進化版</h1>

    <div class="input-group">
        <label class="group-title">🎯 故事換皮與美術設定 (Reskin & Lore)</label>
        <textarea id="taskInput" rows="2" placeholder="請描述美術換皮。例如：『主角是魔法學徒，敵人是數字怪獸』..."></textarea>
    </div>

    <div class="input-group">
        <label class="group-title" style="color: var(--edu);">📚 學科與教育融合 (Edutainment Mechanics) - 選填</label>
        <textarea id="eduInput" class="edu-textarea" rows="2" placeholder="你想融入什麼教學？例如：『攻擊前必須先解出二位數加減法』或『地圖上要收集成語的缺字才能開門』... 若無則留空。"></textarea>
    </div>

    <div class="grid-container">
        <div class="feature-box">
            <label class="group-title">🕹️ 指定仿作經典遊戲 (Clone Target)</label>
            <div class="select-row">
                <span>選擇精準複製的底層邏輯 (RPG已強制綁定探索地圖)</span>
                <select id="s_genre">
                    <optgroup label="RPG 角色扮演 (強制包含行走地圖)">
                        <option value="dq">勇者鬥惡龍 (DQ) - 網格地圖探索 + 第一人稱回合戰鬥</option>
                        <option value="pokemon">寶可夢 (Pokémon) - 網格地圖探索 + 左右對峙屬性戰鬥</option>
                        <option value="ff">太空戰士 (FF) - 網格地圖探索 + ATB半即時回合戰鬥</option>
                    </optgroup>
                    <optgroup label="ARPG 動作角色扮演">
                        <option value="zelda">薩爾達傳說 - 俯視角探索、劍氣判定、道具解謎</option>
                        <option value="diablo">暗黑破壞神 - 游標點擊移動、掉落裝備、冷卻血瓶</option>
                    </optgroup>
                    <optgroup label="Platformer 橫向平台跳躍">
                        <option value="mario">超級瑪利歐 - 踩踏判定、頂磚塊、慣性滑行</option>
                        <option value="megaman">洛克人 - 射擊與跳躍獨立、衝刺、BOSS無敵幀</option>
                    </optgroup>
                    <optgroup label="Roguelike / Survivor 割草生存">
                        <option value="vampire">吸血鬼倖存者 - 自動攻擊、經驗寶石、三選一升級</option>
                    </optgroup>
                    <optgroup label="其他經典類型">
                        <option value="contra">魂斗羅 (Contra) - 八向射擊、捲曲跳躍</option>
                        <option value="raiden">雷電 (Raiden) - 縱向強制卷軸、跟隨飛彈</option>
                        <option value="kingdomrush">王國保衛戰 (Kingdom Rush) - 塔防、兵營攔截</option>
                        <option value="pacman">小精靈 (Pac-Man) - 迷宮尋路、無敵反殺</option>
                    </optgroup>
                </select>
            </div>
            <div class="select-row">
                <span>操作方式適配</span>
                <select id="s_input">
                    <option value="PC 鍵盤操作為主 (提示畫面需註明 WASD/方向鍵)">PC 鍵盤操作 (WASD/方向鍵)</option>
                    <option value="全端適配 (PC 鍵盤 + 手機畫面繪製透明虛擬搖桿與按鈕)">全端適配 (鍵盤 + 手機虛擬搖桿)</option>
                    <option value="滑鼠/觸控操作為主 (點擊移動/射擊/選單)">純滑鼠/觸控 (Point & Click)</option>
                </select>
            </div>
        </div>

        <div class="feature-box locked">
            <label class="group-title">🛡️ 鐵律：七大完美狀態機 (不可省略)</label>
            <div class="checkbox-item"><input type="checkbox" checked disabled> [1] INIT: 起始畫面 (點擊解鎖BGM)</div>
            <div class="checkbox-item"><input type="checkbox" checked disabled> [2] LOBBY: 大廳 (含開始/教學/設定 按鈕)</div>
            <div class="checkbox-item"><input type="checkbox" checked disabled> [3] SETTINGS: 獨立設定選單 (語言切換/音量)</div>
            <div class="checkbox-item"><input type="checkbox" checked disabled> [4] TUTORIAL: 獨立示範教學區 (看完回大廳)</div>
            <div class="checkbox-item"><input type="checkbox" checked disabled> [5] PLAYING: 遊戲主體 + ESC暫停監聽</div>
            <div class="checkbox-item"><input type="checkbox" checked disabled> [6] PAUSED: 暫停遮罩 (繼續 / 回大廳)</div>
            <div class="checkbox-item"><input type="checkbox" checked disabled> [7] GAMEOVER: 結算重置 (清空變數，拒絕F5)</div>
        </div>
    </div>

    <button class="generate-btn" onclick="generate()">🚀 產生教育神作與系統進化指令</button>

    <div class="output-box">
        <button class="copy-btn" onclick="copy()">複製提示詞</button>
        <pre id="outputArea">請設定參數並點擊生成...</pre>
    </div>
</div>

<script>
    const cloneRules = {
        "dq": "【核心機制仿作：勇者鬥惡龍 (RPG雙系統)】\n**絕對禁止只有單調的戰鬥畫面！你必須實作完整的「雙系統」：**\n1. **行走地圖(Overworld)**：實作 2D 網格地圖，玩家使用方向鍵移動角色探索。必須包含障礙物碰撞。\n2. **隨機遇敵(Encounter)**：在地圖移動時有低機率觸發暗雷，畫面閃爍後切換至「第一人稱回合制戰鬥」。\n3. **戰鬥系統**：包含攻擊/魔法/逃跑選單，計算 HP/MP 與傷害公式。戰鬥結束後切換回地圖並給予經驗值。",
        "pokemon": "【核心機制仿作：寶可夢 (RPG雙系統)】\n**絕對禁止只有單調的戰鬥畫面！你必須實作完整的「雙系統」：**\n1. **行走地圖(Overworld)**：實作俯視角(Top-down) 2D 行走地圖。設置「草叢」區塊，只有在草叢移動才會觸發戰鬥。\n2. **回合制戰鬥**：切換至左右對峙畫面。實作屬性相剋邏輯(如水剋火)，以及具備 PP(使用次數)限制的技能選單。戰鬥勝利後回到地圖。",
        "ff": "【核心機制仿作：太空戰士 (RPG雙系統)】\n**絕對禁止只有單調的戰鬥畫面！你必須實作完整的「雙系統」：**\n1. **行走地圖(Overworld)**：實作角色自由移動的探索地圖。觸發戰鬥時必須有轉場碎裂動畫。\n2. **ATB戰鬥**：進入戰鬥後，我方與敵方分列左右。實作 ATB(Active Time Battle) 讀條機制，角色等待計時條集滿才能下達指令。",
        "zelda": "【核心機制仿作：薩爾達眾神三角 (俯視角ARPG)】實作八向移動與探索地圖。攻擊時在角色前方生成判定框(Hitbox)，敵人受擊需有後退硬直。地圖上應有可互動的簡單機關(如推石頭開門)。",
        "diablo": "【核心機制仿作：暗黑破壞神 (點擊ARPG)】實作滑鼠點擊地板尋路(Pathfinding)與點擊敵人自動連續攻擊。實作快捷鍵喝血瓶(具備冷卻時間)與敵人掉落物拾取。",
        "mario": "【核心機制仿作：超級瑪利歐 (平台跳躍)】實作嚴格的 AABB 碰撞。踩在敵人頂部=秒殺敵人並彈起，碰側面=扣血。實作加速度與跳躍高度控制。",
        "megaman": "【核心機制仿作：洛克人 (射擊平台跳躍)】跳躍與射擊狀態獨立。實作地面衝刺(Dash)，以及Boss被擊中時的閃爍無敵幀(i-frames)。",
        "vampire": "【核心機制仿作：吸血鬼倖存者 (割草生存)】玩家僅控制移動，武器依冷卻時間自動發射。敵人死亡掉落經驗，升級時【遊戲暫停】，彈出隨機 3 選 1 的技能提升選單。",
        "contra": "【核心機制仿作：魂斗羅 (捲軸射擊)】實作八向射擊。跳躍時角色會捲曲成球判定框縮小。具備多種子彈邏輯(直線/散彈)。",
        "raiden": "【核心機制仿作：雷電 (縱向STG)】背景強制向下滾動。實作玩家兩種武器(散開紅彈/追蹤藍雷射)與保命炸彈(Bomb)清場無敵機制。",
        "kingdomrush": "【核心機制仿作：王國保衛戰 (塔防)】路徑固定，玩家在特定點建塔。實作兵營塔：在路徑上生成可阻擋(Block)敵人的士兵實體。",
        "pacman": "【核心機制仿作：小精靈 (迷宮動作)】網格迷宮尋路。實作吃到「大力丸」後敵人變色逃跑，玩家可反殺吃掉敵人的機制。"
    };

    function generate() {
        const theme = document.getElementById('taskInput').value || "保留原版美術風格";
        const edu = document.getElementById('eduInput').value;
        const gameKey = document.getElementById('s_genre').value;
        const input = document.getElementById('s_input').value;

        let p = `# Role: 資深遊戲工程師與教育科技(Edutainment)專家\n`;
        p += `這是一次無可挑剔的商業級 Web 遊戲開發任務。你必須完美還原經典遊戲的底層邏輯，同時整合教育元素與專業的系統選單。\n`;
        p += `**【最高警告】：你之前常為了省事而拔掉選單、地圖探索或暫停功能。這次如果出現 \`// 此處省略\`、\`// TODO\` 或缺少下方任何一項 XML 要求，將被視為嚴重失敗！**\n\n`;

        p += `<CRITICAL_CLONE_AND_RESKIN>\n`;
        p += `目標架構：${cloneRules[gameKey]}\n`;
        p += `美術換皮：${theme}\n`;
        p += `</CRITICAL_CLONE_AND_RESKIN>\n\n`;

        if (edu.trim() !== "") {
            p += `<EDUTAINMENT_INTEGRATION> (教育與學科融合 - 必須實作)\n`;
            p += `你必須將以下教育機制**無縫且有趣地**融入遊戲的核心玩法迴圈中，而不是只放一個死板的問答框：\n`;
            p += `教育機制需求：【${edu}】\n`;
            p += `(例如：如果是 RPG，可以在戰鬥攻擊前彈出題目，答對才造成暴擊；如果是動作遊戲，可以將收集品改成正確答案的選項。請用程式碼確實實作此邏輯判斷！)\n`;
            p += `</EDUTAINMENT_INTEGRATION>\n\n`;
        }

        p += `<UNBREAKABLE_STATE_MACHINE> (重點！必須完整實作這 7 大系統階段)\n`;
        p += `你必須使用 \`gameState\` 變數嚴格控制以下流程，**缺一不可，這是獨立遊戲的標準**：\n`;
        p += `1. **INIT_SCREEN**：黑底白字顯示標題與「點擊任意處開始」。點擊後觸發 \`AudioContext.resume()\` 以解鎖瀏覽器 BGM 限制，然後進入 LOBBY。\n`;
        p += `2. **LOBBY (大廳主選單)**：顯示遊戲標題，並由程式繪製三個按鈕：【開始遊戲】、【教學說明】、【遊戲設定】。\n`;
        p += `3. **SETTINGS (設定選單)**：獨立介面。必須實作：\n`;
        p += `   - **多國語言切換 (Language)**：實作簡單的 i18n 字典(如繁中/英文)，點擊按鈕即時切換 UI 文字。\n`;
        p += `   - **音訊控制 (Audio)**：實作背景音樂(BGM)與音效(SFX)的開關或音量條。\n`;
        p += `   - 提供【返回大廳】按鈕。\n`;
        p += `4. **TUTORIAL (教學區)**：從大廳進入，獨立顯示。在 Canvas 上畫出圖文操作說明，或用程式跑一段小示範動畫。提供【返回大廳】按鈕。\n`;
        p += `5. **PLAYING (遊戲中)**：遊戲主迴圈。畫面角落**強制繪製一個暫停按鈕**(並監聽 ESC 鍵)。\n`;
        p += `6. **PAUSED (暫停)**：觸發暫停時，\`deltaTime\` 與物件更新必須停止！畫面上方蓋上半透明遮罩，繪製【繼續遊戲】與【返回大廳】按鈕。\n`;
        p += `7. **GAME_OVER**：結算畫面。提供「重新開始」按鈕，點擊後必須**重新初始化所有陣列與變數**重置遊戲，**絕對嚴禁使用 location.reload()**。\n`;
        p += `</UNBREAKABLE_STATE_MACHINE>\n\n`;

        p += `<ULTIMATE_TECH_SPECS>\n`;
        p += `- **操作方案**：${input}\n`;
        p += `- **手感反饋**：必須實作【螢幕震動 (Screen Shake)】、【動態粒子 (Particles)】。\n`;
        p += `- **效能與物理**：所有移動/冷卻必須乘上 \`deltaTime\`。高頻物件必須實作【物件池 (Object Pool)】。\n`;
        p += `- **存檔**：使用 LocalStorage 儲存最高分與語言/音量設定。\n`;
        p += `</ULTIMATE_TECH_SPECS>\n\n`;

        p += `**請確認無誤後，直接輸出單一、完整、無任何省略且包含上述所有功能的 \`\`\`html 代碼區塊！**`;

        document.getElementById('outputArea').innerText = p;
    }

    function copy() {
        const t = document.getElementById('outputArea').innerText;
        navigator.clipboard.writeText(t).then(() => alert('「教育神作與系統進化指令」已複製！這次的 RPG 絕對會有地圖，主選單也會擁有完美的設定功能！'));
    }
</script>

</body>
</html>
